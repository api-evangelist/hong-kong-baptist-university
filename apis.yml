aid: hong-kong-baptist-university
name: Hong Kong Baptist University
description: >-
  Hong Kong Baptist University (HKBU) is a publicly funded, UGC-supported research
  university in Hong Kong SAR. Re-profiled on 2026-08-30 under the API Evangelist
  university pipeline, which settles WHO OPERATES each surface before crediting any
  contract. HKBU operates no central developer portal, no public API catalogue and no
  institution-wide GitHub organisation; github.com/hkbu exists but is empty, and the
  only active HKBU orgs are research labs (HKBUNLP, HKBU-HPML). What HKBU does operate
  itself, verified by live probe, is four things: a Shibboleth/SAML 2.0 identity
  provider at buidp01.hkbu.edu.hk registered in eduGAIN through the Hong Kong Access
  Federation since 2018 and serving 12KB of signed SAML metadata anonymously; a
  self-built GenAI Platform whose Azure-OpenAI-shaped chat-completions and embeddings
  endpoints answer on genai.hkbu.edu.hk behind an api-key header, undocumented publicly;
  a self-hosted Moodle at buelearning.hkbu.edu.hk publishing a live IMS LTI 1.3 JWKS and
  OAuth2 token endpoint under HKBU's own signing keys; and a first-party mobile-app
  backend at mapp-api.hkbu.edu.hk with no public documentation. Everything that looks
  like an HKBU research API is not. The HKBU Scholars portal at scholars.hkbu.edu.hk is
  a CNAME to hkbu.elsevierpure.com — an Elsevier Pure tenancy. The 33 OpenAPI documents
  previously held in this repository were Elsevier's Pure Web Service contract 5.35.0
  (info.contact pure-support@elsevier.com), the same document other Pure institutions
  ship, and have been removed along with everything derived from them. The data is
  HKBU's; the contract is Elsevier's, and it scores in Elsevier's repository, not here.
