- aid: hong-kong-baptist-university:genai-platform-api
  name: HKBU GenAI Platform API (undocumented, key-gated)
  description: >-
    HKBU runs its own generative-AI gateway at genai.hkbu.edu.hk, fronting third-party
    models (Anthropic, Google, Meta AI, OpenAI) for staff and students. Probing on
    2026-08-30 found a live REST surface at /general/rest/deployments/{deployment}/chat/completions
    and /general/rest/deployments/{deployment}/embeddings, routed internally to /api/v0/rest/*
    by a NestJS application. It takes an Azure-OpenAI-shaped request and an api-key request
    header: an unauthenticated POST returns 401 {"message":"API key is missing or invalid."},
    and a POST carrying an api-key header returns a distinct 401
    {"message":"API key validation failed due to an internal error."}, confirming the header
    is the credential channel. No OpenAPI, no public developer documentation and no
    self-service signup were found on any HKBU host; the platform UI is a Next.js SPA behind
    institutional login. Recorded as an institution-operated surface with no contract saved,
    because none is published.
  x-operator: institution
  humanURL: https://genai.hkbu.edu.hk/
  baseURL: https://genai.hkbu.edu.hk/general/rest/
  x-baseurl-note: >-
    The base path answers 404 to a GET by design — only the POST operation paths beneath it
    (/deployments/{deployment}/chat/completions, /deployments/{deployment}/embeddings) are routed.
    Recorded as the correct integration base, not as a browsable page.
