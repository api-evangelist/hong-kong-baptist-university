- aid: hong-kong-baptist-university:scholars-pure-tenancy
  name: HKBU Scholars — Elsevier Pure tenancy (tenant relationship, contract not HKBU's)
  description: >-
    HKBU Scholars is HKBU's research information portal and institutional repository, and
    it is an Elsevier Pure tenancy: scholars.hkbu.edu.hk is a CNAME to hkbu.elsevierpure.com,
    and repository.hkbu.edu.hk is an alias onto the same target. The Pure Web Service API
    answers at /ws/api — the versioned OpenAPI document at /ws/api/524/openapi.yaml returns
    401 without a key, the RapiDoc console at /ws/api/rapidoc.html returns 200 and is titled
    "RapiDoc Pure API documentation", and the OAI-PMH endpoint at /ws/oai?verb=Identify
    returns 401. The records, DOIs and researcher profiles are HKBU's; the contract is
    Elsevier's. Thirty-three OpenAPI documents titled "Pure activity … API" version 5.35.0
    with info.contact pure-support@elsevier.com were removed from this repository on
    2026-08-30, together with all 64 collections, 3 JSON Schemas, 3 JSON Structures, 2
    examples, the JSON-LD context, the vocabulary, both Spectral rulesets, the agentic-access
    map, the authentication summary, the capability edges and two refine reports derived from
    them — 115 files in all. Do not re-add them; the contract scores in Elsevier's repository.
  x-operator: tenant
  humanURL: https://scholars.hkbu.edu.hk/
  baseURL: https://scholars.hkbu.edu.hk/ws/api/
