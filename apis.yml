x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    HKBU operates four surfaces of its own and publishes a machine-readable contract for
    none of them. The Shibboleth/SAML 2.0 IdP metadata at buidp01.hkbu.edu.hk is fully
    anonymous and complete, but it is federation metadata, not an HTTP API, so it yields no
    OpenAPI. The GenAI Platform API and the Moodle LTI 1.3 / web-services endpoints are both
    live and both answer 401/400 for credentials rather than 404, proving the surfaces exist
    while withholding their shape; neither publishes an OpenAPI or public developer
    documentation. The mobile-app backend is first-party only. The one place HKBU did
    publish an OpenAPI — scholars.hkbu.edu.hk/ws/api — is an Elsevier Pure tenancy
    (scholars.hkbu.edu.hk CNAMEs to hkbu.elsevierpure.com) whose contract belongs to
    Elsevier and has been removed from this repository along with everything derived from it — 115 files.
    Two secondary institution hosts could not be read: digital.lib.hkbu.edu.hk returns a 403
    "Access Denied" page to every client tried including a full browser User-Agent, and
    scholars.hkbu.edu.hk/en/ sits behind a Cloudflare interstitial. State is gated rather
    than none because real surfaces were confirmed live behind credentials, and rather than
    vendor_only because the institution-operated set is genuine.
  generated: '2026-08-30'
  method: probed
