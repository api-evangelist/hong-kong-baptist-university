- aid: hong-kong-baptist-university:moodle-lti-platform
  name: HKBU Moodle — IMS LTI 1.3 platform + web services
  description: >-
    HKBU self-hosts Moodle at buelearning.hkbu.edu.hk on its own registrable domain. It
    publishes a live IMS LTI 1.3 Advantage tool-platform key set at /mod/lti/certs.php
    (HTTP 200, one RSA RS256 signing key, kid 233f84e26d75aa18234e) and an OAuth2
    client-credentials token endpoint at /mod/lti/token.php (HTTP 400 invalid_request when
    called bare), and its Moodle Web Services REST entry point at
    /webservice/rest/server.php answers with Moodle's invalidtoken error rather than a 404,
    so the service is enabled and token-gated. The software and the interface shape are
    Moodle's and IMS Global's respectively — no contract is credited to HKBU — but the
    deployment, the domain and the signing keys are HKBU's, which is why the operator is
    institution rather than tenant. This is the repository's evidence for LTI conformance.
  x-operator: institution
