apis:
- aid: hong-kong-baptist-university:identity-federation
  name: HKBU Identity Federation (Shibboleth IdP / SAML 2.0 metadata)
  description: >-
    HKBU's own SAML 2.0 identity provider, entityID https://buidp01.hkbu.edu.hk/idp/shibboleth,
    registered in eduGAIN by the Hong Kong Access Federation (HKAF) since 2018-03-14 with
    scope hkbu.edu.hk. The metadata document is served anonymously (HTTP 200,
    application/xml, 12,306 bytes) and declares both an IDPSSODescriptor and an
    AttributeAuthorityDescriptor across nine endpoints — SAML 2.0 HTTP-POST,
    HTTP-POST-SimpleSign, HTTP-Redirect and SOAP artifact/attribute bindings, plus SAML 1.1
    and the legacy Shibboleth 1.0 AuthnRequest profile — and single logout. This is the one
    machine-readable interface HKBU both authors and operates end to end; the signing keys
    and the attribute release are HKBU's. It is not an HTTP API and carries no OpenAPI.
  x-operator: institution
