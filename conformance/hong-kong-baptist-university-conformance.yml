method: probed
source: >-
  Live probes of HKBU-operated hosts on 2026-08-30, plus the eduGAIN entity registry and the
  Crossref members API. No conformance is asserted from prose; every entry below names the URL
  and the status code it was read from.
regime: education
note: >-
  Domain standards are read against the education regime's standards[] list — scim, lti,
  oneroster, ed-fi, caliper, qti, oai-pmh, shibboleth, saml, orcid, datacite, crossref.
  Reward-only: an absent standard is recorded as conforms false with the negative probe that
  established it, never left blank and never invented. Where a standard is met by a surface
