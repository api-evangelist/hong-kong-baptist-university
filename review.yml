    3.0.1 contract (/ws/api/openapi.yaml) and RapiDoc docs (/ws/api/rapidoc.html) both return HTTP 200,
    while data endpoints return HTTP 401 pending an API key as expected for Pure. The mobile-app backend
    host (mapp-api.hkbu.edu.hk) resolves and serves app support pages but exposes no public developer
    docs or sign-up. The institutional repository host (repository.hkbu.edu.hk) did not resolve from this
    network. No central institutional developer portal and no organization-wide GitHub org were found;
    only research-group orgs (HKBUNLP, HKBU-HPML) exist. No endpoints were fabricated; only live-checked
    URLs are recorded below.'
