- date: '2026-08-30'
  rating: 2
  summary: 'Operator re-attribution. The 33 OpenAPI documents this repository held were Elsevier''s Pure
    Web Service contract 5.35.0 (info.title "Pure activity ... API", info.contact pure-support@elsevier.com),
    the same document shipped by other Pure institutions in the cohort. They passed the host-based audit
    as institution-owned only because they are served from scholars.hkbu.edu.hk — which DNS shows is a
    CNAME to hkbu.elsevierpure.com, with repository.hkbu.edu.hk aliased onto the same target. All 33,
    the pristine _original, and 81 further files derived from them (64 collections, 3 JSON Schemas, 3
    JSON Structures, 2 examples, a JSON-LD context, a vocabulary, two Spectral rulesets, an agentic-access
    map, an authentication summary, a capability-edge map and two refine reports) were removed — 115 files.
    In their place, four genuinely institution-operated surfaces were found by probe and are new to the
    catalog: a Shibboleth/SAML 2.0 identity provider serving 12KB of anonymous metadata and registered
    in eduGAIN by the Hong Kong Access Federation since 2018; an undocumented GenAI Platform API whose
    chat-completions and embeddings endpoints answer 401 behind an api-key header; a self-hosted Moodle
    publishing a live IMS LTI 1.3 JWKS and OAuth2 token endpoint under HKBU''s own signing keys; and the
    first-party mobile backend. HKBU is also Crossref member 10204 with prefix 10.24112 and 1,763 DOIs.
    This re-profile removes far more than it adds and will lower the score, which is the correction working:
    the previous number was Elsevier''s engineering credited to a university.'
