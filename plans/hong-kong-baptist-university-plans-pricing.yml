specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Hong Kong Baptist University
providerId: hong-kong-baptist-university
created: '2026-06-03'
modified: '2026-08-30'
reconciled: false
tags:
- Education
- Higher Education
- University
- Plans
description: >-
  Hong Kong Baptist University is a non-commercial, UGC-funded higher-education institution and
  sells no API. Revised 2026-08-30 against what was actually probed: HKBU operates four surfaces of
  its own — a Shibboleth/SAML identity provider, a GenAI Platform gateway, a self-hosted Moodle with
  LTI 1.3 and web services, and a first-party mobile backend — and exactly one of them, the IdP
  metadata document, is reachable without a credential. The rest require institutional affiliation,
  not payment. There is no free tier, no paid tier and no self-service signup, because there is no
  commercial offering to tier. The earlier claim of public library, repository, course and
  open-metadata APIs was not supported by probe and has been removed.
notes: >-
  No per-seat or per-call pricing exists to publish. "Free / Open" covers the anonymously
  readable Shibboleth IdP metadata only; "Affiliation / Credentialed" covers everything else,
  gated by institutional identity rather than by payment.
sources:
- https://raw.githubusercontent.com/api-evangelist/hong-kong-baptist-university/refs/heads/main/apis.yml
plans:
- id: hong-kong-baptist-university-free-open
  name: Free / Open
  type: free
  description: >-
    Anonymously readable institutional metadata — the SAML 2.0 / Shibboleth IdP metadata document at
    buidp01.hkbu.edu.hk. No charge, no registration, no key. This is the whole of HKBU's open surface.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
- id: hong-kong-baptist-university-affiliation
  name: Affiliation / Credentialed
  type: free
  description: Administrative and identity APIs gated behind institutional SSO, client certificates, or federation membership rather than payment.
  entries:
  - label: Credentialed Access
    name: credentialed_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
